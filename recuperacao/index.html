<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F172A">
<title>Recuperação de vendas</title>
<link rel="icon" href="/img/linka-icone-180.png">
<style>
:root{--navy:#0F172A;--navy2:#172238;--line:#2B3A52;--gold:#D4A72C;--txt:#F8FAFC;--mut:#A9B6C9;--ok:#22C55E;--red:#F87171;--blue:#60A5FA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--txt);font:15px/1.45 "Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:19px;margin:0}
h1 small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:7px 11px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut)}
.stat.g b{color:var(--gold)}.stat.k b{color:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--navy2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.tab[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--mut);font-size:12px}
select{background:var(--navy2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card.pago{opacity:.65}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nome{font-weight:700;font-size:16px;word-break:break-word}
.quando{font-size:12px;color:var(--mut);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#24324d;color:var(--mut)}
.tag.carrinho{background:#3b2f0e;color:#F5CF6B}.tag.pendente{background:#0f2a4a;color:var(--blue)}.tag.falhou{background:#43191c;color:var(--red)}
.tag.pago{background:#0f3320;color:var(--ok)}.tag.mandei{background:#1f2a40;color:#cbd5e1}
.info{font-size:13px;color:var(--mut);word-break:break-word}
.acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.zap{flex:1 1 180px;display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#062b14;border:0;border-radius:12px;padding:11px 12px;font-weight:800;text-decoration:none}
.sec{flex:0 1 auto;background:none;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:13px}
.vazio{text-align:center;color:var(--mut);padding:40px 10px}
.login{max-width:360px;margin:18vh auto 0;text-align:center}
.login input{width:100%;margin:14px 0 10px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--navy2);color:var(--txt);font:inherit;font-size:16px;text-align:center}
.login button{width:100%;padding:13px;border-radius:12px;border:0;background:var(--gold);color:var(--navy);font-weight:800}
.erro{color:var(--red);font-size:13px;min-height:18px}
details.msgs{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:6px 0 14px}
details.msgs summary{cursor:pointer;font-weight:700;font-size:14px}
details.msgs label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
details.msgs textarea{width:100%;min-height:96px;border-radius:10px;border:1px solid var(--line);background:var(--navy);color:var(--txt);font:inherit;font-size:14px;padding:10px}
details.msgs p{font-size:12px;color:var(--mut);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="login" id="login" hidden>
    <h1>Recuperação de vendas</h1>
    <p class="info">Digite a senha do painel.</p>
    <input id="senha" type="password" autocomplete="current-password" placeholder="Senha">
    <div class="erro" id="loginErro"></div>
    <button id="entrar" type="button">Entrar</button>
  </div>

  <div id="painel" hidden>
    <header>
      <h1>Recuperação de vendas<small id="atualizado">carregando…</small></h1>
      <button class="ghost" id="recarregar" type="button">Atualizar</button>
    </header>
    <div class="stats">
      <div class="stat g"><b id="sPend">–</b><span>para mandar</span></div>
      <div class="stat"><b id="sMand">–</b><span>já mandei</span></div>
      <div class="stat k"><b id="sPago">–</b><span>compraram</span></div>
    </div>
    <div class="tabs" role="group" aria-label="Filtro">
      <button class="tab" data-f="mandar" aria-pressed="true" type="button">Para mandar</button>
      <button class="tab" data-f="mandei" aria-pressed="false" type="button">Já mandei</button>
      <button class="tab" data-f="pago" aria-pressed="false" type="button">Compraram</button>
      <button class="tab" data-f="ignorado" aria-pressed="false" type="button">Ignorados</button>
      <button class="tab" data-f="todos" aria-pressed="false" type="button">Todos</button>
    </div>
    <div class="row">
      <span id="contagem"></span>
      <label>Mostrar <select id="dias"><option value="1">hoje</option><option value="3" selected>3 dias</option><option value="7">7 dias</option><option value="14">14 dias</option></select></label>
    </div>
    <details class="msgs">
      <summary>Mensagens do WhatsApp</summary>
      <label for="mCarrinho">Carrinho abandonado</label><textarea id="mCarrinho"></textarea>
      <label for="mPendente">Pix gerado e não pago</label><textarea id="mPendente"></textarea>
      <label for="mFalhou">Pagamento recusado ou Pix expirado</label><textarea id="mFalhou"></textarea>
      <p>Use {nome} onde quiser o primeiro nome da pessoa. As mensagens ficam salvas neste celular.</p>
      <div class="acoes"><button class="sec" id="padrao" type="button">Voltar às mensagens padrão</button></div>
    </details>
    <div id="lista"></div>
    <details class="msgs" id="avisos">
      <summary>Últimos avisos da Hubla</summary>
      <div id="avisosLista" class="info" style="margin-top:10px">Abra para carregar…</div>
    </details>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/js/recuperacao.js"></script>
</body>
</html>
